name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared in pyproject (requires-python >=3.12);
        # 3.13 is what development currently runs on.
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest tests

  frontend:
    name: frontend (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run

  contracts:
    name: sprint contract lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint sprint contracts
        # Contracts are docs/sprint/sprints/<sprint-id>.md; the matching
        # <sprint-id>-log.md files are free-form and not linted.
        run: |
          shopt -s nullglob
          status=0
          found=0
          for f in docs/sprint/sprints/*.md; do
            case "$f" in *-log.md) continue ;; esac
            found=1
            echo "::group::${f}"
            if ! bash scripts/contract_lint.sh -f "$f"; then
              status=1
            fi
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No sprint contracts found — nothing to lint."
          fi
          exit "$status"
